services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run npm run env:compose or set POSTGRES_PASSWORD}"
      POSTGRES_DB: cinema
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - cinema_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    command: ["npm", "run", "db:deploy", "--workspace", "@cinema-booking/backend"]
    environment:
      DATABASE_URL: "postgresql://cinema:${POSTGRES_PASSWORD:?Run npm run env:compose or set POSTGRES_PASSWORD}@postgres:5432/cinema?schema=public"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: "postgresql://cinema:${POSTGRES_PASSWORD:?Run npm run env:compose or set POSTGRES_PASSWORD}@postgres:5432/cinema?schema=public"
      JWT_SECRET: "${JWT_SECRET:?Run npm run env:compose or set JWT_SECRET}"
      MOCK_PAYMENT_SECRET: "${MOCK_PAYMENT_SECRET:?Run npm run env:compose or set MOCK_PAYMENT_SECRET}"
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["npm", "run", "worker", "--workspace", "@cinema-booking/backend"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://cinema:${POSTGRES_PASSWORD:?Run npm run env:compose or set POSTGRES_PASSWORD}@postgres:5432/cinema?schema=public"
      WORKER_HEALTH_PORT: "4001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    profiles: ["seed"]
    command: ["npm", "run", "db:seed", "--workspace", "@cinema-booking/backend"]
    environment:
      DATABASE_URL: "postgresql://cinema:${POSTGRES_PASSWORD:?Run npm run env:compose or set POSTGRES_PASSWORD}@postgres:5432/cinema?schema=public"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  cinema_postgres_data:
