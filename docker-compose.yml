services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_dev
      POSTGRES_DB: cinema
    ports:
      - "5434:5432"
    volumes:
      - cinema_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cinema_postgres_data:
