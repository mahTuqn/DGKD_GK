# TC-PLAN-07: authenticated ZAP API scan release gate.
# `npm run scan:dast:api` starts ZAP in a unique disposable Compose network;
# the API is reachable there as `http://api:4000`, not localhost in ZAP.
# Pass ZAP_AUTH_HEADER_VALUE='Bearer <disposable Admin JWT>' into the ZAP
# container before it starts; set ZAP_AUTH_HEADER=Authorization and
# ZAP_AUTH_HEADER_SITE=api (hostname only; ZAP does not compare the port).
# Never commit the token or copy it into this plan.
env:
  contexts:
    - name: cinema-api-authenticated
      urls:
        - ${apiBase}
      includePaths:
        - ${apiBase}/api/.*
      excludePaths: []
      authentication:
        method: manual
        verification:
          method: response
          loggedInRegex: '"movies"\s*:'
          loggedOutRegex: 'AUTH_REQUIRED|INVALID_TOKEN|ROLE_FORBIDDEN'
  parameters:
    failOnError: true
    failOnWarning: true
    continueOnFailure: false
    progressToStdout: true
  vars:
    apiBase: http://api:4000

jobs:
  - type: openapi
    parameters:
      apiFile: ../../../docs/openapi.yaml
      context: cinema-api-authenticated
      targetUrl: ${apiBase}

  - type: requestor
    requests:
      - url: ${apiBase}/api/admin/summary
        name: Verify API scan uses the seeded Admin token (must return 200)
        method: GET
        responseCode: 200

  - type: activeScan-config
    parameters:
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 5
      maxAlertsPerRule: 10
      defaultPolicy: Default Policy

  - type: activeScan
    parameters:
      context: cinema-api-authenticated
      maxScanDurationInMins: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: report
    parameters:
      template: traditional-json
      reportDir: ../../../reports/generated/dast
      reportFile: authenticated-api-zap.json
      reportTitle: CinemaBooking authenticated API scan
      reportDescription: ZAP OpenAPI import and active scan using the disposable seeded Admin account.
    sites:
      - ${apiBase}

  - type: exitStatus
    parameters:
      errorLevel: High
