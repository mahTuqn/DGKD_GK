# TC-PLAN-07: unauthenticated ZAP API scan release gate.
# `npm run scan:dast:api` starts ZAP in a unique disposable Compose network;
# the API is reachable there as `http://api:4000`, not localhost in ZAP.
# Start ZAP with ZAP_AUTH_HEADER_VALUE, ZAP_AUTH_HEADER, and ZAP_AUTH_HEADER_SITE unset.
env:
  contexts:
    - name: cinema-api-unauthenticated
      urls:
        - ${apiBase}
      includePaths:
        - ${apiBase}/api/.*
      excludePaths: []
  parameters:
    failOnError: true
    failOnWarning: true
    continueOnFailure: false
    progressToStdout: true
  vars:
    apiBase: http://api:4000

jobs:
  - type: openapi
    parameters:
      apiFile: ../../../docs/openapi.yaml
      context: cinema-api-unauthenticated
      targetUrl: ${apiBase}

  - type: requestor
    requests:
      - url: ${apiBase}/api/auth/me
        name: Verify API scan is unauthenticated
        method: GET
        responseCode: 401

  - type: activeScan-config
    parameters:
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 5
      maxAlertsPerRule: 10
      defaultPolicy: Default Policy

  - type: activeScan
    parameters:
      context: cinema-api-unauthenticated
      maxScanDurationInMins: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: report
    parameters:
      template: traditional-json
      reportDir: ../../../reports/generated/dast
      reportFile: unauthenticated-api-zap.json
      reportTitle: CinemaBooking unauthenticated API scan
      reportDescription: ZAP OpenAPI import and active scan against the disposable local DAST database.
    sites:
      - ${apiBase}

  - type: exitStatus
    parameters:
      errorLevel: Medium
