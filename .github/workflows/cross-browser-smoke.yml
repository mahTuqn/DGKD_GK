name: Cross-browser smoke

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  cross-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema_dev
          POSTGRES_DB: cinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cinema:cinema_dev@localhost:5432/cinema?schema=public
      DATABASE_URL_TEST: postgresql://cinema:cinema_dev@localhost:5432/cinema?schema=public
      E2E_API_URL: http://127.0.0.1:4000/api
      E2E_PREVIEW_URL: http://127.0.0.1:5174/
      VITE_API_URL: http://127.0.0.1:4000/api
      PLAYWRIGHT_CROSS_BROWSER_SMOKE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps firefox webkit
      - name: Run booking, discovery, keyboard, Staff scan, recovery, and accessibility regressions in Firefox and WebKit
        run: npm run test:browser -- --grep 'TC-E2E-01|TC-E2E-02|TC-E2E-03|TC-E2E-09|TC-E2E-16|TC-E2E-17|TC-E2E-18|TC-E2E-19|TC-E2E-27|TC-E2E-31|TC-E2E-32|TC-E2E-33|TC-E2E-34|TC-E2E-35'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cinema-booking-cross-browser-results-${{ github.sha }}
          path: |
            reports/generated/playwright
            reports/generated/playwright-results.json
            test-results
          if-no-files-found: warn
          retention-days: 30
