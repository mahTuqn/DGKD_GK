name: CinemaBooking quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema_dev
          POSTGRES_DB: cinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cinema:cinema_dev@localhost:5432/cinema?schema=public
      DATABASE_URL_TEST: postgresql://cinema:cinema_dev@localhost:5432/cinema?schema=public
      DATABASE_URL_WORKER_PROCESS_TEST: postgresql://cinema:cinema_dev@localhost:5432/cinema_worker_process_test?schema=public
      VITE_API_URL: http://127.0.0.1:4000/api
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_VERSION: 8.30.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Create isolated worker process database
        run: node --input-type=module -e 'import { PrismaClient } from "@prisma/client"; const client = new PrismaClient(); try { await client.$executeRawUnsafe("CREATE DATABASE cinema_worker_process_test"); } finally { await client.$disconnect(); }'
      - name: Apply migrations to worker process database
        run: npm run db:deploy --workspace backend
        env:
          DATABASE_URL: postgresql://cinema:cinema_dev@localhost:5432/cinema_worker_process_test?schema=public
      - run: npm run db:seed
      - run: npm run lint:openapi
      - run: npm run qa:trace
      - run: npm run test:api
      - name: Verify live five-minute hold expiry over HTTP
        run: npm run test:worker-live --workspace backend
        timeout-minutes: 8
        env:
          DATABASE_URL: postgresql://cinema:cinema_dev@localhost:5432/cinema_worker_process_test?schema=public
          DATABASE_URL_TEST: postgresql://cinema:cinema_dev@localhost:5432/cinema_worker_process_test?schema=public
          DATABASE_URL_WORKER_PROCESS_TEST: postgresql://cinema:cinema_dev@localhost:5432/cinema_worker_process_test?schema=public
          HOLD_TTL_SECONDS: "300"
      - name: Create dedicated five-minute worker soak database
        run: node --input-type=module -e 'import { PrismaClient } from "@prisma/client"; const client = new PrismaClient(); try { await client.$executeRawUnsafe("CREATE DATABASE cinema_worker_soak_ci"); } finally { await client.$disconnect(); }'
      - name: Apply migrations to five-minute worker soak database
        run: npm run db:deploy --workspace backend
        env:
          DATABASE_URL: postgresql://cinema:cinema_dev@localhost:5432/cinema_worker_soak_ci?schema=public
      - name: Verify two-worker five-minute soak and graceful restart
        run: npm run test:worker-soak --workspace backend
        timeout-minutes: 8
        env:
          DATABASE_URL: postgresql://cinema:cinema_dev@localhost:5432/cinema_worker_soak_ci?schema=public
          DATABASE_URL_TEST: postgresql://cinema:cinema_dev@localhost:5432/cinema_worker_soak_ci?schema=public
          DATABASE_URL_WORKER_PROCESS_TEST: postgresql://cinema:cinema_dev@localhost:5432/cinema_worker_soak_ci?schema=public
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cinema-booking-browser-results-${{ github.sha }}
          path: |
            reports/generated/playwright
            reports/generated/playwright-results.json
            test-results
          if-no-files-found: warn
          retention-days: 30

  security-dast:
    name: DAST (isolated Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run scan:dast:api
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cinema-booking-dast-reports-${{ github.sha }}
          path: reports/generated/dast
          if-no-files-found: warn
          retention-days: 14

  domain-thresholds:
    name: Domain coverage and mutation thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify domain line and branch coverage thresholds
        run: npm run test:coverage --workspace backend
      - name: Verify hold/payment mutation threshold
        run: npm run test:mutation --workspace backend
      - name: Summarize mutation result and safe diagnostics
        if: always()
        run: node scripts/summarize-mutation.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cinema-booking-domain-quality-${{ github.sha }}
          path: |
            reports/generated/coverage
            reports/generated/mutation
            backend/stryker.log
          if-no-files-found: warn
          retention-days: 14

  docker-worker-health:
    name: Compose worker health smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: cinema-worker-health-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Create disposable Compose secrets
        run: npm run env:compose
      - name: Build Compose services
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" up --detach --build postgres worker
      - name: Verify worker health endpoint
        run: |
          container_id=""
          for attempt in $(seq 1 90); do
            container_id="$(docker compose --project-name "$COMPOSE_PROJECT_NAME" ps --all --quiet worker)"
            if [[ -n "$container_id" ]]; then
              container_state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              health_state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              if [[ "$health_state" == "healthy" ]]; then break; fi
              if [[ "$container_state" == "exited" ]]; then docker compose --project-name "$COMPOSE_PROJECT_NAME" logs worker; exit 1; fi
            fi
            sleep 2
          done
          test -n "$container_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          docker exec "$container_id" node -e "fetch('http://127.0.0.1:4001/healthz').then(response=>process.exit(response.status===200?0:1)).catch(()=>process.exit(1))"
      - name: Clean up this job's Compose project and generated secrets
        if: always()
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans || true
          rm -f .env
